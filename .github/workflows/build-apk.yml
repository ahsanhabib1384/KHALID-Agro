name: Build KHALID AGRO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Writable Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chmod -R a+rwx "$SDK_DIR"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          SDKM=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          set +e
          gradle :app:assembleDebug --console=plain > gradle-build.log 2>&1
          EXIT_CODE=$?
          cat gradle-build.log
          if [ $EXIT_CODE -ne 0 ]; then
            echo "### Repo Config Check" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -la app/ app/src/main/res/values/ >> "$GITHUB_STEP_SUMMARY" 2>&1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "### Compiler / Gradle Errors" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e:|Unresolved|FAILURE:|What went wrong:|Execution failed" -A 4 gradle-build.log | head -n 80 >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            tail -n 30 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $EXIT_CODE

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KHALID-AGRO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
